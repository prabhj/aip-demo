# Databricks App configuration.
# Docs: https://docs.databricks.com/en/dev-tools/databricks-apps/index.html
#
# Deploy with:
#   databricks apps deploy genie-uc-lakebase-demo --source-code-path /Workspace/.../genie_app
#
# Fill in the env vars below (or set them in the Apps UI under
# "App resources" / environment variables) to point this at a client's
# real catalog/schema/warehouse/Lakebase instance instead of the sample data.

command: ["streamlit", "run", "app.py"]

env:
  - name: "UC_CATALOG"
    value: "pj_demo_att_catalog"
  - name: "UC_SCHEMA"
    value: "aip_demo"
  - name: "DATABRICKS_SQL_WAREHOUSE_ID"
    value: "34691042d7237871"            # required -- ID of a small SQL warehouse the app can use
  - name: "MODEL_ENDPOINT"
    value: "databricks-meta-llama-3-3-70b-instruct"
  - name: "LAKEBASE_PROJECT_ID"
    value: "aip-demo"            # leave blank to disable Lakebase tools for a pure-UC demo -- this is the
                          # project ID shown in the Lakebase Postgres UI's "Autoscaling" tab, NOT a hostname
  - name: "LAKEBASE_DATABASE"
    value: "databricks_postgres"
  - name: "ALLOWED_UC_TABLES"
    value: "pj_demo_att_catalog.aip_demo.customers,pj_demo_att_catalog.aip_demo.orders"
  - name: "ALLOWED_LAKEBASE_TABLES"
    value: "support_tickets"
